<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Registro de Usuarios - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
     
        body {
            background-color: #f8f9fa; /* Fondo gris claro de Bootstrap */
        }
        /* Estilo para los botones de la tabla */
        .btn-table-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            margin: 0 5px;
            padding: 0;
            transition: transform 0.2s;
        }

        .btn-table-icon:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center text-primary mb-4">📝 Registro de Usuarios</h1>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form class="row g-3 justify-content-center align-items-center" id="userForm">
                    <div class="col-md-3">
                        <input type="text" id="nombre" class="form-control" placeholder="Nombre" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="apellido" class="form-control" placeholder="Apellido" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="telefono" class="form-control" placeholder="Teléfono" required>
                    </div>
                    <div class="col-md-auto">
                        <button type="button" id="btnGuardar" class="btn btn-success fw-bold">
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Lista de Usuarios Registrados</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Teléfono</th>
                                <th>Opciones</th>
                            </tr>
                        </thead>
                        <tbody id="datos">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        let inpNombre = document.getElementById("nombre")
        let inpApellido = document.getElementById("apellido")
        let inpTelefono = document.getElementById("telefono")
        let registro = [];

        document.getElementById("btnGuardar").addEventListener("click", () => {
            if (inpNombre.value.trim() == "") {
                alert("Se requiere el nombre")
            } else if (inpApellido.value.trim() == "") {
                alert("Se requiere el apellido")
            } else if (inpTelefono.value.trim() == "") {
                alert("Se requiere el teléfono")
            } else {
                let data = {
                    id: Date.now().toString().slice(-6),
                    nombre: inpNombre.value.trim(),
                    apellido: inpApellido.value.trim(),
                    telefono: inpTelefono.value.trim()
                }
                registro.push(data)
                console.log(registro);
                pintar()
                limpiar()
            }
        })

        function limpiar() {
            inpNombre.value = ""
            inpApellido.value = ""
            inpTelefono.value = ""
        }

        function pintar() {
            const tbody = document.getElementById("datos")
            tbody.textContent = "" // Limpia el contenido actual de la tabla

            registro.forEach((item, indice) => {
                let tr = document.createElement("tr")

                // ID
                let tdId = document.createElement("td")
                tdId.textContent = item.id
                tr.appendChild(tdId)

                // Nombre
                let tdNombre = document.createElement("td")
                tdNombre.textContent = item.nombre
                tr.appendChild(tdNombre)

                // Apellido
                let tdApellido = document.createElement("td")
                tdApellido.textContent = item.apellido
                tr.appendChild(tdApellido)

                // Teléfono
                let tdTelefono = document.createElement("td")
                tdTelefono.textContent = item.telefono
                tr.appendChild(tdTelefono)

                // Opciones
                let tdOpciones = document.createElement("td")

                // Botón Editar
                let btnEditar = document.createElement("button")
                btnEditar.textContent = "📝"
                btnEditar.classList.add("btn-table-icon", "text-info") // Clase para el estilo de icono
                btnEditar.title = "Editar"
                btnEditar.addEventListener("click", () => {
                    // Carga los datos en el formulario para editar
                    inpNombre.value = item.nombre
                    inpApellido.value = item.apellido
                    inpTelefono.value = item.telefono

                    // Elimina el registro de la lista para luego guardar el nuevo/modificado
                    registro.splice(indice, 1)
                    pintar()
                })

                // Botón Eliminar
                let btnEliminar = document.createElement("button")
                btnEliminar.textContent = "🗑️"
                btnEliminar.classList.add("btn-table-icon", "text-danger") // Clase para el estilo de icono
                btnEliminar.title = "Eliminar"
                btnEliminar.addEventListener("click", () => {
                    if (confirm(`¿Seguro que deseas eliminar el registro de ${item.nombre}?`)) {
                        registro.splice(indice, 1)
                        pintar()
                    }
                })

                tdOpciones.appendChild(btnEditar)
                tdOpciones.appendChild(btnEliminar)
                tr.appendChild(tdOpciones)

                tbody.appendChild(tr)
            })
        }
    </script>
</body>

</html>
